name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  backend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install backend
        working-directory: backend
        run: pip install -e ".[dev]"
      - name: Lint backend
        working-directory: backend
        run: ruff check .
      - name: Test backend
        working-directory: backend
        run: pytest -q
      - name: Migration smoke test
        working-directory: backend
        env:
          AEGIS_DATABASE_URL: sqlite+aiosqlite:///./migration-smoke.db
        run: python -m app.cli.migration_check
      - name: Run regression suite
        working-directory: backend
        run: >
          python -m app.cli.regression_suite
          --defense-mode layered
          --report-path ../regression-report.md
      - name: Run adversarial security gate
        working-directory: backend
        run: >
          python -m app.cli.security_gate
          --min-score 100
          --max-attack-success-rate 0
          --max-findings 0
          --report-path ../security-gate-report.md
          --campaign-report-path ../campaign-report.json
      - name: Upload security reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: security-reports
          path: |
            security-gate-report.md
            regression-report.md
            campaign-report.json

  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install frontend
        working-directory: frontend
        run: npm ci
      - name: Lint frontend
        working-directory: frontend
        run: npm run lint
      - name: Typecheck frontend
        working-directory: frontend
        run: npm run typecheck
      - name: Build frontend
        working-directory: frontend
        run: npm run build

  security-scan:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install scanners
        run: pip install pip-audit bandit[toml]

      - name: Dependency audit (blocking)
        working-directory: backend
        run: pip-audit --strict --progress-spinner off .

      - name: Static analysis (blocking)
        working-directory: backend
        run: bandit -r app -c pyproject.toml

      - name: Audit frontend dependencies (blocking)
        working-directory: frontend
        run: npm audit --audit-level=high

  container-scan:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write
    steps:
      - uses: actions/checkout@v4

      - name: Build backend image
        run: docker build -t sentinel-aegis-backend:ci ./backend

      - name: Scan backend image (blocking)
        uses: aquasecurity/trivy-action@0.28.0
        with:
          image-ref: sentinel-aegis-backend:ci
          format: table
          exit-code: "1"
          ignore-unfixed: true
          severity: CRITICAL,HIGH

      - name: Scan filesystem for secrets and misconfiguration
        uses: aquasecurity/trivy-action@0.28.0
        with:
          scan-type: fs
          scan-ref: .
          scanners: secret,misconfig
          format: table
          exit-code: "1"
          severity: CRITICAL,HIGH
