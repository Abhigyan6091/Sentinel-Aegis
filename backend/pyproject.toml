[project]
name = "aegisai-backend"
version = "0.1.0"
description = "FastAPI backend for the AegisAI AI application security platform."
requires-python = ">=3.12"
dependencies = [
  "aiosqlite>=0.20.0",
  "alembic>=1.13.2",
  "asyncpg>=0.29.0",
  "fastapi>=0.115.0",
  "httpx>=0.27.2",
  "pydantic>=2.8.2",
  "pydantic-settings>=2.4.0",
  "prometheus-client>=0.21.0",
  "redis>=5.0.8",
  "sqlalchemy[asyncio]>=2.0.32",
  "uvicorn[standard]>=0.30.6"
]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["app*"]

[project.optional-dependencies]
dev = [
  "pytest>=8.3.2",
  "pytest-asyncio>=0.24.0",
  "ruff>=0.6.3"
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
pythonpath = ["."]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
ignore = ["UP017", "UP042"]
