apiVersion: apps/v1
kind: Deployment
metadata:
  name: sentinel-aegis-backend
  namespace: sentinel-aegis
  labels:
    app.kubernetes.io/name: sentinel-aegis
    app.kubernetes.io/component: backend
spec:
  replicas: 2
  selector:
    matchLabels:
      app.kubernetes.io/name: sentinel-aegis
      app.kubernetes.io/component: backend
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxUnavailable: 0
      maxSurge: 1
  template:
    metadata:
      labels:
        app.kubernetes.io/name: sentinel-aegis
        app.kubernetes.io/component: backend
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        fsGroup: 10001
        seccompProfile:
          type: RuntimeDefault
      # Migrations run once per rollout, before any new pod serves traffic, so the
      # schema is never half-applied while requests are in flight.
      initContainers:
        - name: migrate
          image: ghcr.io/example/sentinel-aegis-backend:1.0.0
          command: ["alembic", "upgrade", "head"]
          envFrom:
            - configMapRef:
                name: sentinel-aegis-config
          env:
            - name: AEGIS_DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: sentinel-aegis-secrets
                  key: database_url
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          resources:
            requests:
              cpu: 100m
              memory: 256Mi
            limits:
              memory: 512Mi
      containers:
        - name: backend
          image: ghcr.io/example/sentinel-aegis-backend:1.0.0
          ports:
            - name: http
              containerPort: 8000
          envFrom:
            - configMapRef:
                name: sentinel-aegis-config
          env:
            # Secret plumbing lives beside the volumeMount it governs, not in the
            # ConfigMap, so the mount path and the reader stay in one place.
            - name: AEGIS_SECRETS_PROVIDER
              value: "file"
            - name: AEGIS_SECRETS_FILE_DIR
              value: "/run/secrets"
            - name: AEGIS_DATABASE_URL
              value: "secret://file/database_url"
            - name: AEGIS_REDIS_URL
              value: "secret://file/redis_url"
            - name: AEGIS_ANTHROPIC_API_KEY
              value: "secret://file/anthropic_api_key"
          volumeMounts:
            - name: secrets
              mountPath: /run/secrets
              readOnly: true
            - name: tmp
              mountPath: /tmp
          readinessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 5
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 15
            periodSeconds: 20
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          resources:
            requests:
              cpu: 250m
              memory: 512Mi
            limits:
              memory: 1Gi
      volumes:
        - name: secrets
          secret:
            secretName: sentinel-aegis-secrets
            defaultMode: 0400
        - name: tmp
          emptyDir: {}
